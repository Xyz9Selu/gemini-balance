volumes:
  mysql_data:
services:
  gemini-balance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-balance
    restart: unless-stopped
    ports:
      - "18000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; exit(0) if requests.get('http://localhost:8000/health').status_code == 200 else exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: bizlink-speedy-network
    external: true
